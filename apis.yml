description: 'Saturnbird Coffee (三顿半) is a Chinese specialty coffee company known for premium instant
  coffee made with its proprietary REPUS extraction technology (cold extraction plus intelligent drying)
  using 100% Arabica beans. Its numbered Number Series and Express Series products, a Red Dot Design Award
  winner and Specialty Coffee Association member, are sold direct-to-consumer online and through collaborations
  with roasters including April Coffee, Kurasu, Monogram Coffee, and Fritz Coffee Company. Backed by Hongshan
  (HSG), it was surfaced as a portfolio company and added to the API Evangelist network. It is a consumer
  packaged-goods e-commerce brand with no public developer API surface.'
